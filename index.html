<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Principal's Office</title><style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#242b35;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}header{height:54px;background:#0f548c;color:white;display:flex;align-items:center;gap:20px;padding:0 18px}header b{font-size:18px}header span{margin-left:auto;font-size:13px}.layout{display:flex;height:calc(100vh - 54px)}nav{width:205px;background:#f0f3f9;border-right:1px solid #d9e0eb;padding:14px 10px;flex-shrink:0}nav button{display:block;border:0;background:none;width:100%;text-align:left;padding:12px;border-radius:6px;color:#334155}nav button.active,nav button:hover{background:#dbeafa;color:#004d8b}.main{flex:1;min-width:0;display:flex;flex-direction:column}.toolbar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid #ddd;background:white;flex-wrap:wrap}.primary{background:#0f65aa;color:white;border:0;padding:9px 14px;border-radius:5px}.secondary{background:white;border:1px solid #cbd5e1;padding:8px 12px;border-radius:5px}.mail{display:flex;flex:1;min-height:0}.list{width:350px;max-width:45%;border-right:1px solid #dbe2ec;overflow:auto;background:white}.item{padding:16px;border-bottom:1px solid #e9edf4;cursor:pointer}.item:hover,.item.selected{background:#eaf3ff}.item.unread{border-left:4px solid #0f65aa}.item small{color:#64748b}.item strong{display:block;margin:5px 0}.reading{flex:1;overflow:auto;padding:24px;background:#fafbfe}.message{background:white;border:1px solid #e0e6ef;border-radius:8px;padding:16px;margin:0 0 12px;box-shadow:0 1px 2px #00000008}.message .meta{font-size:13px;color:#64748b;line-height:1.7}.message p{white-space:pre-wrap;line-height:1.55}.option{display:block;margin:7px 0;padding:10px;background:#edf5ff;border:1px solid #bfd7f1;border-radius:6px;text-align:left;width:100%}.option:hover{background:#dcecff}textarea{width:100%;min-height:105px;padding:12px;border:1px solid #cbd5e1;border-radius:6px;resize:vertical}input{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:5px}.panel{padding:24px;overflow:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:white;border:1px solid #e0e6ef;padding:18px;border-radius:8px}.card label{display:block;color:#64748b;font-size:13px}.card b{font-size:24px}.tablewrap{overflow:auto;background:white;border:1px solid #e0e6ef;border-radius:8px;margin-top:18px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #e8edf4;font-size:14px}th{background:#edf3f9}h2{margin:0 0 16px}.hint{color:#66758b;font-size:13px}.pill{background:#e4edf7;border-radius:20px;padding:4px 9px;font-size:12px}.modalback{position:fixed;inset:0;background:#0006;display:grid;place-items:center;padding:16px}.modal{background:white;border-radius:10px;padding:24px;width:min(650px,100%);display:grid;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.empty{color:#64748b;padding:24px}@media(max-width:750px){nav{width:60px;padding:8px 4px}nav button{font-size:0;padding:12px 8px}nav button::first-letter{font-size:20px}.list{width:38%}.reading{padding:12px}.item{padding:10px}header b{font-size:15px}}
</style></head><body><header><b>▦ The Principal's Office</b><span id="clock"></span></header><div class="layout"><nav id="nav"></nav><div class="main"><div class="toolbar" id="toolbar"></div><div id="content" style="flex:1;min-height:0;overflow:auto"></div></div></div><div id="modal"></div><script>
const KEY='principals-office-demo-v1';const initial=()=>({date:'2026-10-13',minutes:560,folder:'Inbox',selected:1,threads:[{id:1,subject:'Student Parking Lot Safety — Decision Requested',folder:'Inbox',unread:true,closed:false,messages:[{from:'Director of Campus Security',to:'Principal',cc:'Executive Assistant; Dean of Students',time:'8:12 AM',body:'Principal, we have documented six speeding incidents, four wrong-way drivers, three failure-to-yield complaints, and two minor property-damage collisions. No injuries have been reported.'},{from:'Dean of Students',to:'Director of Campus Security',cc:'Principal; Executive Assistant',time:'8:28 AM',body:'I recommend progressive enforcement: written warning, parent meeting, five-day parking suspension, and eventual semester revocation, with an appeal process.'},{from:'Director of Facilities',to:'Principal',cc:'Executive Assistant; Campus Security',time:'8:44 AM',body:'Proposed safety improvements total $12,500: signs $1,200, markings $2,800, pedestrian crossings $3,600, and a speed display $4,900.'},{from:'Director of Finance',to:'Principal',cc:'Executive Assistant; Facilities; Campus Security',time:'9:07 AM',body:'Finance recommends immediate enforcement without additional spending, pending the already-approved $7,250 campus traffic engineering assessment.'}],options:['A — Approve $12,500 improvements and discipline','B — Begin enforcement; await engineering report','C — Implement stricter enforcement','D — Include parking lot in comprehensive traffic redesign']},{id:2,subject:'Technology Modernization — Phase 2 Budget',folder:'Inbox',unread:true,closed:false,messages:[{from:'Director of Technology',to:'Principal',cc:'Executive Assistant',time:'8:15 AM',body:'Phase 2 planning is underway. We are incorporating all 86 student laptops into the itemized budget to avoid duplicate purchasing. Detailed reconciliation is due October 15.'}],options:[]},{id:3,subject:'Enrollment Expansion Feasibility',folder:'Inbox',unread:true,closed:false,messages:[{from:'Director of Admissions',to:'Principal',cc:'Executive Assistant',time:'8:32 AM',body:'Our study of expanding enrollment from 875 to 900 students remains on track for October 15. No additional offers have been issued.'}],options:[]}],ledger:[{date:'2026-10-12',desc:'Alumni Annual Fund Contribution',amount:8750},{date:'2026-10-12',desc:'Athletic Facility Rental',amount:1650},{date:'2026-10-12',desc:'Replacement Classroom Door Closers',amount:-482.60},{date:'2026-10-12',desc:'Cafeteria Serving Supplies',amount:-693.25},{date:'2026-10-12',desc:'Replacement Computer Peripherals',amount:-275.80}],balance:3153482.03,projects:[{name:'Technology Modernization — Phase 2',status:'Awaiting itemized budget',due:'Oct 15',budget:'TBD'},{name:'Campus Traffic Engineering Assessment',status:'In progress',due:'Oct 20',budget:'$7,250 approved'},{name:'Cafeteria Expansion Study',status:'In progress',due:'Oct 23',budget:'$4,800 approved'},{name:'Swimming & Diving Program',status:'Preparing for spring',due:'Jan 2027',budget:'Up to $46,500'},{name:'Enrollment Expansion Study',status:'In progress',due:'Oct 15',budget:'Internal review'},{name:'Wireless Access Points',status:'Scheduled',due:'Oct 16',budget:'$19,800 approved'}],notes:[],nextId:4});let s;try{s=JSON.parse(localStorage.getItem(KEY))||initial()}catch{s=initial()}let tab='Inbox';const $=id=>document.getElementById(id);const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);function save(){localStorage.setItem(KEY,JSON.stringify(s))}function now(){return new Date(s.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})+' · '+String(Math.floor(s.minutes/60)%24).padStart(2,'0')+':'+String(s.minutes%60).padStart(2,'0')}function advance(n){s.minutes+=n;while(s.minutes>=1020){nextDay()}save();render()}function nextDay(){let d=new Date(s.date+'T12:00:00');do{d.setDate(d.getDate()+1)}while([0,6].includes(d.getDay()));s.date=d.toISOString().slice(0,10);s.minutes=480}function render(){const tabs=['Inbox','Sent','Drafts','Archive','Finances','Projects','Staff','Calendar','Notes'];$('clock').textContent=now()+' · DEMO';$('nav').innerHTML=tabs.map((t,i)=>`<button class="${tab===t?'active':''}" onclick="switchTab('${t}')">${['📥','📤','📝','🗄️','💰','📋','👥','📅','📌'][i]} ${t}</button>`).join('');$('toolbar').innerHTML=`<button class="primary" onclick="compose()">✉ New mail</button><button class="secondary" onclick="advance(30)">+30 minutes</button><button class="secondary" onclick="dayEnd()">☾ Day End</button><span class="hint">Local demo only · AI not connected · This browser saves its own data</span>`;if(['Inbox','Sent','Drafts','Archive'].includes(tab))renderMail();else if(tab==='Finances')renderFinance();else if(tab==='Projects')renderProjects();else if(tab==='Notes')renderNotes();else if(tab==='Staff')$('content').innerHTML='<div class="panel"><h2>Staff</h2><div class="card">140 employees (current simulation baseline)<p class="hint">Full staff directory and hiring updates will be connected to the database in a later build.</p></div></div>';else $('content').innerHTML='<div class="panel"><h2>Calendar</h2><div class="card">October 15 — Technology Phase 2 budget and admissions study<br><br>October 16 — Wireless access point installation window<br><br>October 20 — Campus traffic engineering final report<br><br>October 23 — Cafeteria expansion study</div></div>'}function switchTab(t){tab=t;render()}function renderMail(){let threads=s.threads.filter(x=>x.folder===tab);let current=s.threads.find(x=>x.id===s.selected&&x.folder===tab);$('content').innerHTML=`<div class="mail"><div class="list">${threads.length?threads.map(t=>`<div class="item ${t.unread?'unread':''} ${current?.id===t.id?'selected':''}" onclick="openThread(${t.id})"><small>${esc(t.messages.at(-1)?.from||'Principal')} · ${t.messages.length} messages</small><strong>${esc(t.subject)}</strong><small>${esc(t.messages.at(-1)?.body.slice(0,90)||'')}</small></div>`).join(''):'<div class="empty">No conversations here.</div>'}</div><div class="reading">${current?`<h2>${esc(current.subject)}</h2><div class="actions"><button class="secondary" onclick="moveThread(${current.id},'Archive')">Archive</button><button class="secondary" onclick="moveThread(${current.id},'Inbox')">Move to Inbox</button><button class="secondary" onclick="forwardThread(${current.id})">Forward</button></div>${current.messages.map(m=>`<div class="message"><b>${esc(m.from)}</b><div class="meta">To: ${esc(m.to)}<br>CC: ${esc(m.cc)}<br>${esc(m.time)}</div><p>${esc(m.body)}</p></div>`).join('')}${current.options?.length?`<h3>Decision options</h3>${current.options.map((o,i)=>`<button class="option" onclick="choose(${current.id},${i})">${esc(o)}</button>`).join('')}`:''}<h3>Reply</h3><textarea id="reply" placeholder="Type A, B, C, D or a custom instruction..."></textarea><div class="actions"><button class="primary" onclick="reply(${current.id})">Send reply</button><button class="secondary" onclick="reply(${current.id},true)">Reply all</button></div><p class="hint">Demo: replies are saved, but no AI-generated response or automatic school change occurs yet.</p>`:'<div class="empty">Select a conversation to read.</div>'}</div></div>`}function openThread(id){s.selected=id;s.threads.find(x=>x.id===id).unread=false;save();render()}function moveThread(id,f){s.threads.find(x=>x.id===id).folder=f;s.selected=null;save();render()}function choose(id,i){$('reply').value=s.threads.find(x=>x.id===id).options[i];$('reply').focus()}function reply(id,all=false){const v=$('reply').value.trim();if(!v)return alert('Please enter a reply.');let t=s.threads.find(x=>x.id===id);t.messages.push({from:'Principal',to:all?'All thread participants':'Original sender',cc:'Executive Assistant',time:now(),body:v});t.options=[];s.minutes+=10;save();render();alert('Reply saved to this demo thread. AI delivery and automatic updates will be added when we connect the backend.')}function compose(forward=''){ $('modal').innerHTML=`<div class="modalback"><div class="modal"><h2>New message</h2><label>To</label><input id="to" placeholder="Director of Athletics"><label>CC</label><input id="cc" value="Executive Assistant"><label>Subject</label><input id="subject" value="${esc(forward)}"><label>Message</label><textarea id="body" placeholder="Write your email..."></textarea><div class="actions"><button class="primary" onclick="sendCompose()">Send</button><button class="secondary" onclick="saveDraft()">Save draft</button><button class="secondary" onclick="closeModal()">Cancel</button></div></div></div>`}function forwardThread(id){compose('FW: '+s.threads.find(t=>t.id===id).subject)}function closeModal(){$('modal').innerHTML=''}function createMail(folder){let to=$('to').value.trim(),subject=$('subject').value.trim(),body=$('body').value.trim();if(!to||!subject||!body)return alert('Enter a recipient, subject and message.');let id=s.nextId++;s.threads.unshift({id,subject,folder,unread:false,closed:false,messages:[{from:'Principal',to,cc:$('cc').value,time:now(),body}],options:[]});s.selected=id;closeModal();save();tab=folder;render()}function sendCompose(){createMail('Sent')}function saveDraft(){createMail('Drafts')}function renderFinance(){$('content').innerHTML=`<div class="panel"><h2>Finances</h2><div class="cards"><div class="card"><label>Operating balance</label><b>${money(s.balance)}</b></div><div class="card"><label>Endowment (separate)</label><b>${money(15000000)}</b></div><div class="card"><label>Investments (separate)</label><b>${money(5000000)}</b></div></div><p class="hint">Demo ledger contains the most recent five transactions. The full historical ledger will be imported into the cloud database later. No simulated payments occur when you send emails in this version.</p><div class="tablewrap"><table><tr><th>Date</th><th>Description</th><th>Amount</th></tr>${s.ledger.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.desc)}</td><td>${x.amount>=0?'+':''}${money(x.amount)}</td></tr>`).join('')}</table></div></div>`}function renderProjects(){$('content').innerHTML=`<div class="panel"><h2>Projects</h2><div class="tablewrap"><table><tr><th>Project</th><th>Status</th><th>Due</th><th>Budget</th></tr>${s.projects.map(p=>`<tr><td>${esc(p.name)}</td><td><span class="pill">${esc(p.status)}</span></td><td>${esc(p.due)}</td><td>${esc(p.budget)}</td></tr>`).join('')}</table></div><p class="hint">Project updates from emails will be automated when AI and the backend are connected.</p></div>`}function renderNotes(){$('content').innerHTML=`<div class="panel"><h2>Principal's Notes</h2><textarea id="note" placeholder="Write a note for yourself..."></textarea><div class="actions"><button class="primary" onclick="addNote()">Save note</button></div>${s.notes.slice().reverse().map(n=>`<div class="message"><small>${esc(n.time)}</small><p>${esc(n.text)}</p></div>`).join('')}</div>`}function addNote(){let v=$('note').value.trim();if(!v)return;s.notes.push({time:now(),text:v});save();render()}function dayEnd(){if(!confirm('End the simulated school day? The demo advances the date only; AI events and bank transactions are not active yet.'))return;nextDay();save();render()}render();
</script></body></html>
